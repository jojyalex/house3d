# Glenwood House - parametric plan model (DRAFT v0.9)
#
# Layout traced from the permit drawing (sizes scaled by proportion, about +/-0.3 m) and
# updated from the photographs in the Images folder (room names, finishes, doors, windows,
# front canopies and car porch). Items marked `confidence: low` are inferred.
#
# Conventions
#   units: millimetres
#   plan orientation: as drawn on the sheet (top of the sheet = +y, right = +x)
#   FRONT of the house (street side, car porch) = bottom of the plan (south, -y)
#   origin: south-west (bottom-left) outer corner of the ground floor
#   rooms: origin [x, y] + size [width, depth]; upper floors share the same origin
#   room types: living, bedroom, kitchen, room, bath, stair, balcony (open, railing), steps (open slab)
#   room extras: color (floor colour), railing: slats (balconies), notes
#   openings: room + side (south/north/east/west) + offset along that side + width, type door|window;
#     leaf: false = open archway without a door leaf. Interior doors are assumed (not on the drawing)
#   adjoining rooms share exact edges so walls merge cleanly (needed for the walkthrough)
#   canopies: flat glass canopies, z = height above the level's elevation
#   pergolas: white beam grid with a glass top; origin/size in plan, z = top height above the level, spacing = beam spacing
#   furniture: room + type + at [x, y] (lower-left of the footprint, relative to the room origin)
#     + optional size [w, d] and facing (direction the front of the piece faces). For sofa, bed,
#     wardrobe and similar, w runs along the front and d is the depth. For counter, curtain and hob,
#     size is the plain [x extent, y extent]. round_table and fan use `at` as the CENTRE.
#     types: sofa, armchair, coffee_table, chair, round_table, bed, wardrobe, piano, counter,
#     wall_cabinet, hob, fridge, wc, basin, shower, curtain, fan

meta:
  name: Glenwood House
  version: 0.9
  status: draft-needs-verification
  developer: Edens Group (watermark on the photographs)
  type: detached villa in a gated row of villas, three floors plus roof terrace
  front_facing: south (bottom of the plan)
  north: not set
  source_drawing: Completion drawing, building permit dated 19-10-2013 (plans at 1:100)

reference_images:
  - file: Images/Front View From Outside.jpg
    shows: Front facade. Covered car porch with dark paving and a stone-clad pillar, double-leaf
      timber front door, curtained windows left and right of it, a wood-slatted balcony above
      the porch, glass canopies at first-floor and roof level, white walls with brown timber accents.
  - file: Images/Ground Floor - Looking Left.jpg
    shows: Ground-floor hall running to a dining area (round table, four chairs) with a window wall,
      false ceiling with cove lighting, timber slat feature wall, doors to a bedroom (wardrobe),
      stair and a washroom behind a jali screen.
  - file: Images/Ground Floor - Looking Right.jpg
    shows: Living room with sofa set, curtained window wall, wallpaper feature wall, wall niche,
      ceiling fan and cove-lit false ceiling. Timber front door with sidelights on the right.
  - file: Images/Ground Floor Kitchen - Looking Right.jpg
    shows: U-shaped kitchen, white cabinets, black granite counters, two windows, chimney, two fridges.
  - file: Images/Stairs - Multiple Bedroom - Washroom.jpg
    shows: Collage. Three bedrooms with curtains, AC and wardrobes; a family hall with a piano;
      kitchen; bathroom with wall-hung WC and shower; dog-leg stair with timber and glass railing,
      black granite treads and a steel handrail.

